#
# - date: "2026-01-01"                       # ISO YYYY-MM-DD
#   event: Event Name                        # The name of the event
#   venue: Venue Name                        # optional; shown as "Event • Venue" if both set
#   location: City, Country
#   url: https://example.com/tickets         # optional
#   image: https://example.com/flyer.jpg     # optional, JSON-LD only; must be a full URL
#   organizer: Promoter Name                 # optional, JSON-LD only; don't default to DJ Zwackery
#   organizerUrl: https://example.com        # optional, JSON-LD only; site or socials
#   price: "25.00"                           # optional, JSON-LD only; string, update as tiers sell out
#   priceCurrency: AUD                       # optional, JSON-LD only

