name: Test anonymous yt-dlp download

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Deno 🦕
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp 🔧
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Attempt anonymous download (no cookies, no client override)
        run: |
          yt-dlp -f "bestvideo[height<=144]+worstaudio/worst[height<=240]/worst" \
            -o test.mp4 --merge-output-format mp4 \
            "https://www.youtube.com/watch?v=jfk875dMOgg"
          ls -la test.mp4
