name: Checks

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Format check 🎨
        run: npm run format:check

      - name: Lint 🔍
        run: npm run lint

      - name: Typecheck 🧪
        run: npm run typecheck
