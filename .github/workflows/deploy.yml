name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  schedule:
    # 01:00 UTC = noon Melbourne (AEDT) / 1pm Melbourne (AEST); cron is fixed UTC,
    # so this drifts an hour either side of noon across the DST switchover
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a newer run cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Restore content cache 💾
        uses: actions/cache@v6
        with:
          path: .cache
          # rolling cache: unique key each run, restore the most recent one
          key: content-cache-${{ github.run_id }}
          restore-keys: |
            content-cache-

      - name: Cache Astro image generation 🖼️
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-

      - name: Setup Node 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Deno 🦕
        # yt-dlp needs a JS runtime to solve YouTube's extraction challenges;
        # without one it degrades to clients that hit "Sign in to confirm
        # you're not a bot" on datacenter IPs like this runner's.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp 🔧
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Write YouTube cookies 🍪
        # Authenticated requests get treated far more leniently than
        # anonymous ones, which is what was tripping "Sign in to confirm
        # you're not a bot" on this runner's shared IP. Only written when the
        # secret is set, so a fork/PR build without it just runs cookie-less
        # (same as local dev) instead of failing.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube-cookies.txt
          fi

      - name: Build Astro 🏗️
        uses: withastro/action@v6
        with:
          package-manager: npm
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
