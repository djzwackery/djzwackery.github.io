name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  schedule:
    # cron is fixed UTC; this drifts an hour either side of noon Melbourne across DST
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Restore content cache 💾
        uses: actions/cache@v6
        with:
          path: .cache
          key: content-cache-${{ github.run_id }}
          restore-keys: |
            content-cache-

      - name: Restore ambient data cache 📼
        # Pushed by scripts/push-ambient-data.sh from a real machine — CI's own
        # runner IPs get blocked by YouTube regardless of cookies, so this
        # release asset (not this repo's git history) is the source of truth.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/data
          gh release download ambient-data-cache --pattern 'ambient-data.tar.gz' --dir . --clobber
          tar -xzf ambient-data.tar.gz -C .cache
          rm -f ambient-data.tar.gz

      - name: Cache Astro image generation 🖼️
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-

      - name: Setup Node 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Deno 🦕
        # JS runtime yt-dlp needs to solve YouTube's extraction challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp 🔧
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install ffmpeg 🎬
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build Astro 🏗️
        uses: withastro/action@v6
        with:
          package-manager: npm
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
