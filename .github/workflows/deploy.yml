name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  schedule:
    # cron is fixed UTC; this drifts an hour either side of noon Melbourne across DST
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets.* isn't usable directly in step `if:` conditions, only in
      # env/with values — this is the workaround.
      HAS_YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES != '' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Restore content cache 💾
        uses: actions/cache@v6
        with:
          path: .cache
          key: content-cache-${{ github.run_id }}
          restore-keys: |
            content-cache-

      - name: Cache Astro image generation 🖼️
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-

      - name: Setup Node 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Deno 🦕
        # JS runtime yt-dlp needs to solve YouTube's extraction challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp 🔧
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install ffmpeg 🎬
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup YouTube cookies 🍪
        # Authenticated requests avoid YouTube's anti-bot wall on this runner's IP
        if: ${{ env.HAS_YOUTUBE_COOKIES == 'true' }}
        uses: AnimMouse/setup-yt-dlp/cookies@v3
        with:
          cookies: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Build Astro 🏗️
        uses: withastro/action@v6
        with:
          package-manager: npm
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Generate ambient-mode data 🌈
        run: npm run generate:ambient-data
        env:
          YOUTUBE_COOKIES_ENABLED: ${{ env.HAS_YOUTUBE_COOKIES }}

      - name: Refresh YouTube cookies 🔄
        # Pushes yt-dlp's rotated cookie jar back to the secret so it doesn't go stale
        if: ${{ env.HAS_YOUTUBE_COOKIES == 'true' }}
        uses: AnimMouse/setup-yt-dlp/cookies/update@v3
        with:
          cookies_secret_name: YOUTUBE_COOKIES
          token: ${{ secrets.SECRETS_PAT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
