name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC — rebuild to refresh content
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a newer run cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Restore content cache 💾
        uses: actions/cache@v6
        with:
          path: .cache
          # rolling cache: unique key each run, restore the most recent one
          key: content-cache-${{ github.run_id }}
          restore-keys: |
            content-cache-

      - name: Cache Astro image generation 🖼️
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-

      - name: Setup Node 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build Astro 🏗️
        uses: withastro/action@v6
        with:
          package-manager: npm
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
